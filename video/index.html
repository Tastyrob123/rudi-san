:root{--nacht:#121110;--gold:#c8a46a;--hell:#efe8db;--e1:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html{background:var(--nacht);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--nacht) url(../markenbuch/tapete.svg) 50% 0/150px auto;color:var(--hell);font:300 17px/1.6 'Archivo',sans-serif;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.leiste{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(16px,4vw,64px)}
.leiste img{height:40px;width:auto;display:block}
.leiste span{font-weight:500;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(10px,2vw,30px) clamp(16px,4vw,64px) 40px}

.film{width:min(1280px,100%);border-radius:clamp(10px,1.4vw,20px);overflow:hidden;box-shadow:0 0 0 1px rgba(200,164,106,.3),0 60px 90px -40px rgba(0,0,0,.9);background:#000;aspect-ratio:1920/1206}
.film video{display:block;width:100%;height:100%;object-fit:cover}
p{margin:clamp(22px,2.6vw,34px) 0 0;max-width:40em;text-align:center;color:rgba(239,232,219,.82);font-size:clamp(16px,1.3vw,19px)}
.kn{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.kn a{display:inline-flex;align-items:center;gap:16px;height:54px;padding:0 8px 0 26px;border-radius:999px;font-weight:500;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--nacht);background:linear-gradient(180deg,#fbf6ec,#e8dcc6 50%,#cdb48a);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 26px -14px rgba(0,0,0,.7);transition:transform .5s var(--e1)}
.kn a.rand{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(200,164,106,.5)}
.kn a:hover{transform:translateY(-2px)}
.kn i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#3a3630,#121110);color:var(--gold)}
.kn a.rand i{background:transparent;box-shadow:inset 0 0 0 1px rgba(200,164,106,.5)}
.kn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.4}
footer{padding:22px clamp(16px,4vw,64px) 28px;font-size:14px;color:rgba(239,232,219,.6);text-align:center}
